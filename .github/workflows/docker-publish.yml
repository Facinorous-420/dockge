name: Publish Docker image

# Builds the Dockerfile at the repo root and pushes it to GitHub Container Registry:
#   - push to master      -> ghcr.io/<owner>/dockge:latest (+ :sha-xxxxxxx)
#   - push a tag "v1.1"   -> ghcr.io/<owner>/dockge:v1.1
#   - manual run          -> Actions tab > "Publish Docker image" > Run workflow

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Image names must be lowercase
          images: ghcr.io/${{ github.repository_owner }}/dockge
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # Add linux/arm64 here if you ever need it (much slower to build)
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
